<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Sisyphus \u2014 Zero-Install API Testing Tool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>\U0001FAA8</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/tabs.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/request.css">
<link rel="stylesheet" href="css/response.css">
</head>
<body>

<!-- TOP NAV -->
<div class="top-nav">
    <div class="nav-brand"><i class="fas fa-mountain"></i> API Sisyphus</div>
    <div class="nav-right">
        <select id="envNavSelect" class="env-select-nav" title="Active environment"></select>
        <button id="manageEnvBtn" class="icon-btn-nav" title="Manage environments"><i class="fas fa-gear"></i></button>
    </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar" id="tabBar"></div>
<button class="tab-add-btn" id="newTabBtn" title="New tab (Ctrl+T)" style="position:fixed; top:48px; z-index:95;"><i class="fas fa-plus"></i></button>

<div class="main-container">

    <!-- LEFT SIDEBAR -->
    <div class="left-sidebar">
        <div class="sidebar-section" style="flex:1;">
            <div class="section-header" id="colHeader">
                <span class="section-title"><i class="fas fa-chevron-down section-toggle"></i> Collections</span>
                <div class="section-header-actions">
                    <input type="file" id="importCollectionInput" accept="application/json" style="display:none;">
                    <button id="importCollectionBtn" title="Import collection JSON"><i class="fas fa-upload"></i></button>
                    <button id="newCollectionBtn" title="New collection"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div class="section-content" id="colContent">
                <div class="collections-list" id="collectionsList"></div>
            </div>
        </div>

        <div class="sidebar-section" style="flex:1;">
            <div class="section-header" id="histHeader">
                <span class="section-title"><i class="fas fa-chevron-down section-toggle"></i> History</span>
            </div>
            <div class="section-content" id="histContent">
                <div class="history-list" id="historyList"></div>
                <button class="btn-clear" id="clearHistoryBtn" style="display:none;"><i class="fas fa-trash"></i> Clear History</button>
            </div>
        </div>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="right-content">
        <div class="request-bar">
            <select id="methodSelect" class="method-select">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="PATCH">PATCH</option>
                <option value="DELETE">DELETE</option>
                <option value="HEAD">HEAD</option>
                <option value="OPTIONS">OPTIONS</option>
            </select>
            <input type="text" id="urlInput" class="url-input" placeholder="https://api.example.com/endpoint or {{API_BASE}}/users/1" autocomplete="off" spellcheck="false">
            <button class="btn-send" id="sendBtn"><span class="btn-text"><i class="fas fa-paper-plane"></i> SEND</span><span class="spinner"></span></button>
            <button class="btn-cancel" id="cancelBtn"><i class="fas fa-stop"></i> Cancel</button>
            <button class="btn" id="copyCurlBtn" title="Copy as cURL"><i class="fas fa-terminal"></i> Copy cURL</button>
            <button class="btn" id="importCurlBtn" title="Import from cURL"><i class="fas fa-file-import"></i> Import cURL</button>
            <button class="btn" id="saveRequestBtn" title="Save to collection (Ctrl+S)"><i class="fas fa-save"></i> Save</button>
        </div>

        <div class="panes-container">
            <!-- REQUEST PANE -->
            <div class="pane pane-left">
                <div class="pane-header">
                    <div class="tabs">
                        <button class="tab active" data-req-tab="params"><i class="fas fa-sliders"></i> Params</button>
                        <button class="tab" data-req-tab="headers"><i class="fas fa-list"></i> Headers</button>
                        <button class="tab" data-req-tab="auth"><i class="fas fa-key"></i> Auth</button>
                        <button class="tab" data-req-tab="body"><i class="fas fa-file-code"></i> Body</button>
                        <button class="tab" data-req-tab="tests" id="reqTabTests"><i class="fas fa-vial"></i> Tests</button>
                    </div>
                </div>
                <div class="pane-content">
                    <div class="req-tab-content" data-req-tab="params" style="display:block;">
                        <div id="paramsRows"></div>
                        <button class="btn-add" id="addParamBtn"><i class="fas fa-plus"></i> Add Param</button>
                    </div>
                    <div class="req-tab-content" data-req-tab="headers" style="display:none;">
                        <div id="headersRows"></div>
                        <button class="btn-add" id="addHeaderBtn"><i class="fas fa-plus"></i> Add Header</button>
                    </div>
                    <div class="req-tab-content" data-req-tab="auth" style="display:none;">
                        <select id="authTypeSelect" class="auth-type-select">
                            <option value="none">No Auth</option>
                            <option value="bearer">Bearer Token</option>
                            <option value="basic">Basic Auth</option>
                            <option value="apikey">API Key</option>
                        </select>
                        <div class="auth-fields" id="authFields"></div>
                    </div>
                    <div class="req-tab-content" data-req-tab="body" style="display:none;">
                        <select id="bodyTypeSelect" class="body-type-select">
                            <option value="none">No Body</option>
                            <option value="json">JSON</option>
                            <option value="form">Form Data</option>
                            <option value="raw">Raw</option>
                        </select>
                        <div id="bodyContent"></div>
                    </div>
                    <div class="req-tab-content" data-req-tab="tests" style="display:none;">
                        <div id="testsRows"></div>
                        <button class="btn-add" id="addTestBtn"><i class="fas fa-plus"></i> Add Test</button>
                    </div>
                </div>
            </div>

            <!-- RESPONSE PANE -->
            <div class="pane pane-right">
                <div class="response-meta" id="responseMetaBar" style="display:none;"></div>
                <div class="response-search" id="responseSearchBar" style="display:none;">
                    <input type="text" id="responseSearchInput" placeholder="Search response body\u2026">
                    <span class="match-count" id="searchMatchCount"></span>
                </div>
                <div class="pane-header" id="responseTabsBar" style="display:none;">
                    <div class="tabs">
                        <button class="tab active" data-res-tab="body"><i class="fas fa-code"></i> Body</button>
                        <button class="tab" data-res-tab="headers"><i class="fas fa-list"></i> Headers</button>
                        <button class="tab" data-res-tab="raw"><i class="fas fa-file-lines"></i> Raw</button>
                        <button class="tab" data-res-tab="tests"><i class="fas fa-vial"></i> Tests</button>
                    </div>
                </div>
                <div class="pane-content" id="responseContentArea"></div>
            </div>
        </div>
    </div>
</div>

<!-- SAVE TO COLLECTION MODAL -->
<div class="modal-overlay hidden" id="saveModalOverlay">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title"><i class="fas fa-save"></i> Save Request</div>
            <button class="modal-close" id="saveModalCloseBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="field-group">
                <label class="field-label">Name</label>
                <input type="text" class="field-input" id="saveModalName" placeholder="e.g. Get user by ID">
            </div>
            <div class="field-group">
                <label class="field-label">Collection</label>
                <select class="field-select" id="saveModalCollection"></select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" id="saveModalCancelBtn">Cancel</button>
            <button class="btn btn-primary" id="saveModalConfirmBtn">Save</button>
        </div>
    </div>
</div>

<!-- CURL IMPORT MODAL -->
<div class="modal-overlay hidden" id="curlModalOverlay">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title"><i class="fas fa-file-import"></i> Import from cURL</div>
            <button class="modal-close" id="curlModalCloseBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <textarea class="curl-input" id="curlInput" placeholder="curl -X POST https://api.example.com/users \
  -H 'Content-Type: application/json' \
  -d '{&quot;name&quot;:&quot;Asim&quot;}'"></textarea>
            <div class="modal-hint">Paste a curl command \u2014 method, URL, headers, body, and basic/bearer auth are parsed automatically into a new tab.</div>
            <div class="modal-error" id="curlModalError"></div>
        </div>
        <div class="modal-footer">
            <button class="btn" id="curlModalCancelBtn">Cancel</button>
            <button class="btn btn-primary" id="curlModalImportBtn">Import</button>
        </div>
    </div>
</div>

<!-- MANAGE ENVIRONMENTS MODAL -->
<div class="modal-overlay hidden" id="envModalOverlay">
    <div class="modal" style="width:640px;">
        <div class="modal-header">
            <div class="modal-title"><i class="fas fa-gear"></i> Environments</div>
            <button class="modal-close" id="envModalCloseBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div id="envModalList" style="margin-bottom:16px;"></div>
            <button class="btn-add" id="envModalAddBtn" style="margin-bottom:16px;"><i class="fas fa-plus"></i> New Environment</button>
            <div id="envModalEditor"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="envModalDoneBtn">Done</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
